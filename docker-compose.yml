version: '3'

services:
  payload:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - '13601:13601'
    env_file:
      - .env
    environment:
      DATABASE_URI: postgresql://payloadAdmin:${POSTGRES_PASSWORD}@host.docker.internal:13501/payloadDatabase
    extra_hosts:
      - "host.docker.internal:host-gateway"